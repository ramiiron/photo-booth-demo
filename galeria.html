<style>
  /* Gallery-specific styles — the theme lives in estilos.css */
  body { padding:56px 20px 90px; }
  .contenido { position:relative; z-index:2; max-width:640px; margin:0 auto; }
  .gal-titulo { font-size:clamp(36px,9vw,60px); margin:20px 0 10px; }
  .gal-sub { color:var(--tinta-suave); font-size:15px; font-weight:500; margin-bottom:26px; }

  /* Strip / Individuals tabs */
  .tabs { display:inline-flex; background:#fff; border-radius:999px; padding:5px;
          box-shadow:var(--sombra); margin-bottom:30px; }
  .tab { font-family:inherit; font-weight:800; font-size:13px; letter-spacing:.1em;
         text-transform:uppercase; border:none; background:transparent; color:var(--tinta-suave);
         padding:12px 26px; border-radius:999px; cursor:pointer; }
  .tab.sel { background:var(--tinta); color:#fff; }

  /* Filters (applied in the gallery, after scanning the QR) */
  .filtros { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:26px; }
  .filtro-g { font-family:inherit; font-size:12px; font-weight:800; letter-spacing:.08em;
              text-transform:uppercase; background:#fff; color:var(--tinta-suave);
              border:2px solid transparent; padding:10px 16px; border-radius:999px;
              cursor:pointer; box-shadow:var(--sombra); }
  .filtro-g.sel { background:var(--tinta); color:#fff; }

  /* Strip frames */
  .marcos { display:flex; gap:10px; justify-content:center; margin-bottom:24px; flex-wrap:wrap; }
  .marco { font-family:inherit; border:2px solid transparent; background:#fff;
           border-radius:16px; padding:10px 14px; cursor:pointer;
           display:flex; align-items:center; gap:9px;
           font-size:12px; font-weight:800; letter-spacing:.06em; color:var(--tinta); }
  .marco.sel { border-color:var(--tinta); }
  .mini { width:22px; height:34px; border-radius:4px; display:block; }
  .mini.retro { background:#f5eedd; border:1px solid #d8c9a8; }
  .mini.clasico { background:#fff; border:1px solid #ddd; }
  .mini.pastel { background:linear-gradient(160deg,#ffd6e8,#d9c8ff); }
  .mini.noir { background:#0b0b0d; }

  /* Strip preview (600:1800 ratio) */
  .tira { position:relative; width:200px; aspect-ratio:600/1800; margin:0 auto 26px; padding:14px;
          display:flex; flex-direction:column; border-radius:18px;
          box-shadow:var(--sombra); }
  .tira-marca { position:absolute; right:12px; bottom:10px; font-size:8px; font-weight:800;
                letter-spacing:.08em; color:#fff; opacity:.95;
                -webkit-text-stroke:.6px rgba(0,0,0,.8);
                text-shadow:0 1px 4px rgba(0,0,0,.65); }
  .tira-cabeza { height:26px; display:flex; align-items:center; justify-content:space-between;
                 font-size:8px; font-weight:800; letter-spacing:.14em; }
  .tira-logo { display:flex; align-items:center; justify-content:center; padding:7px 10px 1px; }
  .tira-logo img { max-height:34px; max-width:88%; object-fit:contain; display:block; }
  .tira-fotos { flex:1; display:flex; flex-direction:column; gap:10px; margin:9px 0; }
  .tira-fotos img { flex:1; width:100%; min-height:0; object-fit:cover; border-radius:10px;
                   background:#ddd; display:block; }
  .tira-pie { height:30px; display:flex; align-items:center; justify-content:center;
              font-size:9px; font-weight:800; letter-spacing:.22em; }
  .tira.retro { background:#f5eedd; color:#2b2118; }
  .tira.clasico { background:#fff; color:#9a9a9a; }
  .tira.pastel { background:linear-gradient(170deg,#ffd6e8,#d9c8ff); color:#fff; }
  .tira.noir { background:#0b0b0d; color:#7dff9a; }
  .tira.noir .rec { color:#ff3b3b; }

  /* Individuals */
  .foto { margin-bottom:40px; }
  .foto img { width:100%; max-width:520px; border-radius:30px; display:block;
              margin:0 auto 18px; box-shadow:var(--sombra); background:#fff; }

  /* Boomerang */
  #boom-video { width:100%; max-width:520px; border-radius:30px; display:block;
                margin:0 auto 22px; box-shadow:var(--sombra); background:#000; }

  footer { font-size:12px; font-weight:700; letter-spacing:.24em; text-transform:uppercase;
           color:var(--tinta-suave); margin-top:34px; }
  .priv-nota { font-size:12px; font-weight:500; color:var(--tinta-suave);
               margin-top:10px; line-height:1.6; }
  .cta-reserva { display:inline-block; margin-top:24px; font-size:13px; font-weight:800;
                 letter-spacing:.14em; text-transform:uppercase; text-decoration:none;
                 color:#fff; background:var(--degradado);
                 padding:15px 28px; border-radius:999px;
                 box-shadow:0 12px 30px rgba(244,63,142,.35); }
  .cta-reserva:active { transform:scale(.97); }
</style>
</head>
<body>
<script src="./fondo.js"></script>

<script>
const esc = s => String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const qs = new URLSearchParams(location.search);
const fotos = qs.getAll("f").filter(u => u.startsWith("https://"));
const videoUrl = (qs.get("v") || "").startsWith("https://") ? qs.get("v") : "";
const $ = id => document.getElementById(id);

// Per-event customization (comes in the QR from the booth config)
const evNombre = (qs.get("ev") || "").trim();
const negocio = (qs.get("neg") || "").trim(); // business name for the watermark
// Client logo for the strip (Cloudinary only, so the canvas stays exportable)
const logoUrl = (qs.get("logo") || "").startsWith("https://res.cloudinary.com/") ? qs.get("logo") : "";

// ===== Language (comes from the booth via the QR: &lang=es) =====
const LANG = qs.get("lang") === "es" ? "es" : "en";
const GT = {
  en: {
    tituloDef: 'Your <span class="degradado-texto">photos</span>',
    subDef: "Choose how to take them",
    vacio: "This gallery needs a link with photos.<br>Scan the Photo Booth QR code to see yours.",
    boomListo: "Your boomerang is ready",
    tira: "Strip", ind: "Individuals",
    bn: "B&W", vivido: "Vivid",
    descargarTira: "Download strip (PNG)", generando: "Generating…", abriendo: "Opening…",
    descargarFoto: "Download", descargarBoom: "Download boomerang",
    gracias: "Thanks for coming",
    priv: "Photos are automatically deleted<br>24 hours after the event.",
    cta: "Book Pose & Post for your event",
    errFoto: "Couldn't prepare the photo. Try again.",
    errVideo: "Couldn't prepare the video. Try again.",
    errTira: "Couldn't generate the strip. Try the individual photos.",
    compartirTira: "My Photo Booth strip"
  },
  es: {
    tituloDef: 'Tus <span class="degradado-texto">fotos</span>',
    subDef: "Elige cómo llevártelas",
    vacio: "Esta galería necesita un enlace con fotos.<br>Escanea el código QR del Photo Booth para ver las tuyas.",
    boomListo: "Tu boomerang está listo",
    tira: "Tira", ind: "Individuales",
    bn: "B/N", vivido: "Vívido",
    descargarTira: "Descargar tira (PNG)", generando: "Generando…", abriendo: "Abriendo…",
    descargarFoto: "Descargar", descargarBoom: "Descargar boomerang",
    gracias: "Gracias por venir",
    priv: "Las fotos se eliminan automáticamente<br>24 horas después del evento.",
    cta: "Reserva Pose & Post para tu evento",
    errFoto: "No se pudo preparar la foto. Intenta de nuevo.",
    errVideo: "No se pudo preparar el video. Intenta de nuevo.",
    errTira: "No se pudo generar la tira. Prueba las fotos individuales.",
    compartirTira: "Mi tira del Photo Booth"
  }
};
const G = GT[LANG];
document.documentElement.lang = LANG;
if (LANG === "es") document.title = "Tus fotos — Photo Booth";

const PLANTILLAS = {
  "fiesta":      { en: "Your session", es: "Tu sesión" },
  "boda":        { en: "Our wedding",  es: "Nuestra boda" },
  "baby-shower": { en: "Baby shower",  es: "Baby shower" },
  "cumpleanos":  { en: "Birthday",     es: "Cumpleaños" },
  "halloween":   { en: "Halloween",    es: "Halloween" },
  "graduacion":  { en: "Graduation",   es: "Graduación" },
};
const tpl = PLANTILLAS[qs.get("tpl")] ? qs.get("tpl") : "fiesta";
document.body.dataset.tpl = tpl;
if (evNombre){
  $("ev-pildora").textContent = PLANTILLAS[tpl][LANG];
  $("ev-titulo").textContent = evNombre;
} else {
  $("ev-pildora").textContent = PLANTILLAS[tpl][LANG];
  $("ev-titulo").innerHTML = G.tituloDef;
}

// Static texts in the chosen language
$("sub").textContent = G.subDef;
$("tab-tira").textContent = G.tira;
$("tab-ind").textContent = G.ind;
$("descargar-tira").textContent = G.descargarTira;
$("descargar-boomerang").textContent = G.descargarBoom;
$("pie-gracias").textContent = G.gracias;
$("priv-nota").innerHTML = G.priv;
$("cta-reserva").textContent = G.cta;
document.querySelector('[data-filtro="bn"]').textContent = G.bn;
document.querySelector('[data-filtro="vivido"]').textContent = G.vivido;

// Available strip frames
const MARCOS = {
  retro:   { cabeza:["PHOTO BOOTH","RETRO · 2026"], pie:(LANG === "es" ? "✦ RECUERDOS ✦" : "✦ MEMORIES ✦"), fondo:"#f5eedd", tinta:"#2b2118", fuente:800 },
  clasico: { cabeza:["FLASHBOX SEOUL","CLASSIC MINIMAL"], pie:"", fondo:"#ffffff", tinta:"#9a9a9a", fuente:800 },
  pastel:  { cabeza:["PASTEL DREAM",""], pie:"cutie", fondo:null, degradado:["#ffd6e8","#d9c8ff"], tinta:"#ffffff", fuente:800 },
  noir:    { cabeza:["[RAW_03]",'<span class="rec">● REC</span>'], pie:"CYBER NOIR", fondo:"#0b0b0d", tinta:"#7dff9a", fuente:800, rec:"#ff3b3b" }
};
let marcoActual = "retro";

// Filters: applied here in the gallery, after scanning the QR
// (live preview + baked into the strip PNG and shared photos)
const FILTROS = {
  original: "none",
  bn:       "grayscale(1) contrast(1.08)",
  sepia:    "sepia(0.85)",
  vintage:  "sepia(0.35) saturate(1.5) contrast(1.05)",
  vivido:   "saturate(1.7) contrast(1.12)",
};
let filtroActual = "original";
async function compartirVideo(btn){
  const orig = btn.textContent;
  btn.disabled = true;
  btn.textContent = G.abriendo;
  try {
    const blob = await (await fetch(videoUrl)).blob();
    const ext = blob.type.includes("mp4") ? "mp4" : "webm";
    const file = new File([blob], "pose-post-boomerang." + ext, { type: blob.type || "video/mp4" });
    if (navigator.canShare && navigator.canShare({ files: [file] })){
      try {
        await navigator.share({ files: [file], title: "Photo Booth" });
      } catch(e){
        if (!e || e.name !== "AbortError") descargarBlob(blob, file.name);
      }
    } else {
      descargarBlob(blob, file.name);
    }
  } catch(e){
    alert(G.errVideo);
  }
  btn.textContent = orig;
  btn.disabled = false;
}

function fijarFiltro(nombre){
  filtroActual = FILTROS[nombre] ? nombre : "original";
  document.querySelectorAll(".filtro-g").forEach(c => c.classList.toggle("sel", c.dataset.filtro === filtroActual));
  document.querySelectorAll(".tira-fotos img, .foto img").forEach(img => { img.style.filter = FILTROS[filtroActual]; });
}
document.querySelectorAll(".filtro-g").forEach(b => { b.onclick = () => fijarFiltro(b.dataset.filtro); });

if (!fotos.length && !videoUrl){
  $("sub").innerHTML = G.vacio;
} else if (videoUrl){
  // Boomerang session: just the looping clip + download/share
  $("sub").textContent = G.boomListo;
  $("opciones").classList.remove("oculto");
  document.querySelector(".tabs").classList.add("oculto");
  $("filtros").classList.add("oculto");
  $("vista-tira").classList.add("oculto");
  $("vista-ind").classList.add("oculto");
  $("vista-boomerang").classList.remove("oculto");
  $("boom-video").src = videoUrl;
  $("descargar-boomerang").onclick = e => compartirVideo(e.target);
} else {
  $("opciones").classList.remove("oculto");

  // Strip preview
  $("tira-fotos").innerHTML = fotos.map((f,i) =>
    `<img src="${esc(f)}" alt="${LANG === "es" ? "Foto" : "Photo"} ${i+1}" loading="lazy">`).join("");
  if (logoUrl){
    $("tira-logo-img").src = logoUrl;
    $("tira-logo").classList.remove("oculto");
  }
  $("tira-pie").textContent = evNombre || MARCOS[marcoActual].pie;
  if (negocio){
    $("tira-marca").textContent = "© " + negocio;
    $("tira-marca").classList.remove("oculto");
  }

  // Individuals (watermark composited on a canvas before sharing)
  $("gal").innerHTML = fotos.map((f,i) =>
    `<div class="foto"><img src="${esc(f)}" alt="${LANG === "es" ? "Foto" : "Photo"} ${i+1}" loading="lazy"><br>` +
      `<button class="btn-linea" data-idx="${i}" data-nombre="photo-booth-${i+1}.jpg">${G.descargarFoto}</button></div>`).join("");
  $("gal").addEventListener("click", e => {
    const b = e.target.closest("button[data-idx]");
    if (b) compartirFoto(+b.dataset.idx, b.dataset.nombre, b);
  });

  // Tabs
  const mostrarModo = modo => {
    $("vista-tira").classList.toggle("oculto", modo !== "tira");
    $("vista-ind").classList.toggle("oculto", modo !== "ind");
    $("tab-tira").classList.toggle("sel", modo === "tira");
    $("tab-ind").classList.toggle("sel", modo === "ind");
  };
  $("tab-tira").onclick = () => mostrarModo("tira");
  $("tab-ind").onclick = () => mostrarModo("ind");

  // Frame switch
  $("marcos").addEventListener("click", e => {
    const b = e.target.closest(".marco");
    if (!b) return;
    marcoActual = b.dataset.marco;
    document.querySelectorAll(".marco").forEach(m => m.classList.toggle("sel", m === b));
    const tira = $("tira");
    tira.className = "tira " + marcoActual;
    const M = MARCOS[marcoActual];
    $("tira-cabeza-izq").textContent = M.cabeza[0];
    $("tira-cabeza-der").innerHTML = M.cabeza[1]; // HTML propio (no es input del usuario)
    $("tira-pie").textContent = evNombre || M.pie;
  });

  $("descargar-tira").onclick = descargarTira;
}

// Booking CTA: only shown when the gallery actually has content
if (fotos.length || videoUrl) $("cta-reserva").classList.remove("oculto");

// Business watermark: small © name at the bottom-right of the canvas.
// White text with a dark outline so it reads on any background.
function dibujarMarca(x, W, H, tam){
  if (!negocio) return;
  const texto = "© " + negocio;
  const px = W - tam, py = H - Math.round(tam * 0.7);
  x.save();
  x.font = "800 " + tam + "px Montserrat, Arial, sans-serif";
  x.textAlign = "right";
  x.textBaseline = "bottom";
  x.lineJoin = "round";
  x.lineWidth = Math.max(2, Math.round(tam * 0.22));
  x.strokeStyle = "rgba(0,0,0,.8)";
  x.strokeText(texto, px, py);
  x.fillStyle = "#fff";
  x.fillText(texto, px, py);
  x.restore();
}

// Loads one photo, draws the watermark and returns a JPEG blob
async function fotoConMarca(url){
  const img = await cargar(url);
  const c = document.createElement("canvas");
  c.width = img.naturalWidth || img.width;
  c.height = img.naturalHeight || img.height;
  const x = c.getContext("2d");
  x.filter = FILTROS[filtroActual];
  x.drawImage(img, 0, 0);
  x.filter = "none"; // the watermark is drawn unfiltered
  dibujarMarca(x, c.width, c.height, Math.max(22, Math.round(c.width * 0.032)));
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("blob")), "image/jpeg", 0.92));
}

// Shares the watermarked photo via the native sheet (iOS: "Save Image"
// -> Photos; Android: save -> Gallery). Falls back to a download.
async function compartirFoto(i, nombre, btn){
  const orig = btn.textContent;
  btn.disabled = true;
  btn.textContent = G.abriendo;
  try {
    const blob = await fotoConMarca(fotos[i]);
    const file = new File([blob], nombre, { type: "image/jpeg" });
    if (navigator.canShare && navigator.canShare({ files: [file] })){
      try {
        await navigator.share({ files: [file], title: "Photo Booth" });
      } catch(e){
        // Cancelled sheet: do nothing. Other errors: download.
        if (!e || e.name !== "AbortError") descargarBlob(blob, nombre);
      }
    } else {
      descargarBlob(blob, nombre);
    }
  } catch(e){
    alert(G.errFoto);
  }
  btn.textContent = orig;
  btn.disabled = false;
}

function cargar(url){
  return new Promise((res, rej) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => res(img);
    img.onerror = rej;
    img.src = url;
  });
}
function dibujarCover(x, img, dx, dy, dw, dh){
  const s = Math.max(dw / img.width, dh / img.height);
  const w = img.width * s, h = img.height * s;
  x.drawImage(img, dx + (dw - w) / 2, dy + (dh - h) / 2, w, h);
}
// Draws an image fully inside a box, keeping its aspect ratio (logos)
function dibujarContain(x, img, dx, dy, dw, dh){
  const s = Math.min(dw / img.width, dh / img.height);
  const w = img.width * s, h = img.height * s;
  x.drawImage(img, dx + (dw - w) / 2, dy + (dh - h) / 2, w, h);
}
// Rounded-rect clip path (for the strip's photos)
function clipRedondeado(x, dx, dy, dw, dh, r){
  x.beginPath();
  x.moveTo(dx + r, dy);
  x.arcTo(dx + dw, dy, dx + dw, dy + dh, r);
  x.arcTo(dx + dw, dy + dh, dx, dy + dh, r);
  x.arcTo(dx, dy + dh, dx, dy, r);
  x.arcTo(dx, dy, dx + dw, dy, r);
  x.closePath();
  x.clip();
}

async function descargarTira(){
  const btn = $("descargar-tira");
  btn.textContent = G.generando;
  btn.disabled = true;
  try {
    await document.fonts.ready;
    const M = MARCOS[marcoActual];
    const W = 600, H = 1800, pad = 36, cabezaH = 76, pieH = 96, gap = 26;
    // Client logo (optional): an extra band under the header
    const logoImg = logoUrl ? await cargar(logoUrl).catch(() => null) : null;
    const logoH = logoImg ? 104 : 0;
    const fw = W - pad * 2;
    const fh = (H - pad * 2 - cabezaH - logoH - pieH - gap * 2) / fotos.length;
    const c = document.createElement("canvas");
    c.width = W; c.height = H;
    const x = c.getContext("2d");

    // Background
    if (M.degradado){
      const g = x.createLinearGradient(0, 0, W * 0.3, H);
      g.addColorStop(0, M.degradado[0]); g.addColorStop(1, M.degradado[1]);
      x.fillStyle = g;
    } else {
      x.fillStyle = M.fondo;
    }
    x.fillRect(0, 0, W, H);

    // Client logo under the header
    if (logoImg) dibujarContain(x, logoImg, pad, pad + cabezaH + 4, fw, logoH - 8);

    // Photos (rounded corners, same as the on-screen preview)
    const imgs = await Promise.all(fotos.map(cargar));
    imgs.forEach((img, i) => {
      const dy = pad + cabezaH + logoH + i * (fh + gap);
      x.save();
      clipRedondeado(x, pad, dy, fw, fh, 22);
      x.filter = FILTROS[filtroActual];
      dibujarCover(x, img, pad, dy, fw, fh);
      x.restore();
    });

    // Text
    x.fillStyle = M.tinta;
    x.textAlign = "center";
    x.textBaseline = "middle";
    x.font = "800 24px Montserrat, Arial, sans-serif";
    x.fillText(M.cabeza[0], W / 2, pad + cabezaH / 2 - 12);
    x.font = "700 20px Montserrat, Arial, sans-serif";
    if (marcoActual === "noir"){
      x.fillStyle = M.rec;
      x.fillText("● REC", W / 2, pad + cabezaH / 2 + 16);
      x.fillStyle = M.tinta;
    } else {
      x.fillText(M.cabeza[1], W / 2, pad + cabezaH / 2 + 16);
    }
    const pieTxt = evNombre || M.pie;
    if (pieTxt){
      x.font = "800 26px Montserrat, Arial, sans-serif";
      x.fillStyle = M.tinta;
      x.fillText(pieTxt, W / 2, H - pad - pieH / 2);
    }

    dibujarMarca(x, W, H, 20);

    const blob = await new Promise(r => c.toBlob(r, "image/png"));
    const file = new File([blob], "tira-photo-booth.png", { type: "image/png" });
    let listo = false;
    if (navigator.canShare && navigator.canShare({ files: [file] })){
      btn.textContent = G.abriendo;
      try {
        await navigator.share({ files: [file], title: G.compartirTira });
        listo = true;
      } catch(e){
        // If the user cancelled, do nothing more; if it failed, download
        listo = !e || e.name === "AbortError";
        if (!listo) descargarBlob(blob, "tira-photo-booth.png");
      }
    }
    if (!listo) descargarBlob(blob, "tira-photo-booth.png");
  } catch(e){
    alert(G.errTira);
  }
  btn.textContent = G.descargarTira;
  btn.disabled = false;
}

function descargarBlob(blob, nombre){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
</script>
