<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0b0d">
<title>Tus fotografías — Photo Booth</title>
<style>
  :root{
    --bg:#0b0b0d; --ivory:#f5f1e8; --muted:#8e8e93; --gold:#c8a15a;
    --serif:Didot,'Bodoni MT','Playfair Display',Georgia,serif;
    --sans:-apple-system,'Helvetica Neue',Arial,sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:var(--sans); background:var(--bg); color:var(--ivory);
         text-align:center; padding:56px 20px 80px; -webkit-font-smoothing:antialiased; }
  .eyebrow { font-size:11px; letter-spacing:.42em; text-transform:uppercase;
             color:var(--muted); margin-bottom:18px; padding-left:.42em; }
  h1 { font-family:var(--serif); font-weight:400; font-size:38px; margin-bottom:14px; }
  .regla { width:56px; height:1px; background:var(--gold); margin:0 auto 20px; }
  .sub { color:var(--muted); margin-bottom:44px; font-size:15px; font-weight:300;
         letter-spacing:.05em; line-height:1.7; }
  .foto { margin-bottom:48px; }
  .foto img { width:100%; max-width:460px; border-radius:18px; display:block;
              margin:0 auto 20px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  .foto a { display:inline-block; color:var(--ivory); text-decoration:none;
            font-size:12px; letter-spacing:.3em; text-transform:uppercase;
            padding:16px 40px 16px calc(40px + .3em); border:1px solid var(--gold);
            border-radius:999px; }
  .foto a:active { background:rgba(200,161,90,.14); }
  footer { margin-top:20px; font-size:11px; letter-spacing:.3em; text-transform:uppercase;
           color:var(--muted); }
</style>
</head>
<body>
  <div class="eyebrow">Photo Booth</div>
  <h1>Tus fotografías</h1>
  <div class="regla"></div>
  <div class="sub" id="sub">Guárdalas antes de cerrar esta página</div>
  <div id="gal"></div>
  <footer>Gracias por venir</footer>
<script>
const s = new URLSearchParams(location.search).get("s");
let fotos = [];
try { fotos = JSON.parse(localStorage.getItem("booth-" + s) || "[]"); } catch(e){}
const gal = document.getElementById("gal");
if (!fotos.length){
  document.getElementById("sub").innerHTML =
    "Demo: las fotos solo existen en el teléfono que las tomó.<br>" +
    "En la versión del evento, esta galería es un link público<br>" +
    "que cada invitado abre en su propio teléfono.";
} else {
  gal.innerHTML = fotos.map((f,i) =>
    `<div class="foto"><img src="${f}" alt="Fotografía ${i+1}"><br>` +
    `<a href="${f}" download="photo-booth-${i+1}.jpg">Descargar</a></div>`
  ).join("");
}
</script>
</body>
</html>
