<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#04050c">
<title>Tus fotografías — Photo Booth</title>
<link rel="stylesheet" href="./estilos.css">
<style>
  /* Estilos propios de la galería — el tema vive en estilos.css */
  body { padding:60px 20px 90px; }

  .contenido { position:relative; z-index:2; }
  h1 { font-size:clamp(38px,9vw,64px); letter-spacing:.06em; margin-bottom:8px; }
  .sub-neon { font-size:14px; letter-spacing:.3em; margin-bottom:52px; line-height:2; }
  .foto { margin-bottom:44px; }
  .foto img { width:100%; max-width:560px; border-radius:18px; display:block;
              margin:0 auto 18px;
              box-shadow:0 0 22px rgba(77,227,255,.35), 0 0 70px rgba(255,47,179,.18); }
  .btn-neon { font-size:13px; letter-spacing:.3em;
              padding:16px 42px 16px calc(42px + .3em); }
  footer { font-size:12px; letter-spacing:.24em; text-transform:uppercase;
           color:#8fa3bd; margin-top:20px; }
</style>
</head>
<body>
<script src="./fondo.js"></script>
<div class="contenido">
  <h1 class="neon">Tus<br>fotografías</h1>
  <div class="sub-neon" id="sub">Guárdalas antes de<br>cerrar esta página</div>
  <div id="gal"></div>
  <footer>Gracias por venir</footer>
</div>
<script>
const esc = s => String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const fotos = new URLSearchParams(location.search).getAll("f").filter(u => u.startsWith("https://"));
const gal = document.getElementById("gal");
if (!fotos.length){
  document.getElementById("sub").innerHTML =
    "Esta galería necesita un link con fotos.<br><br>" +
    "Escanea el QR del Photo Booth para ver las tuyas.";
} else {
  gal.innerHTML = fotos.map((f,i) => {
    // En Cloudinary, fl_attachment fuerza la descarga con buen nombre de archivo
    const dl = f.replace("/image/upload/", "/image/upload/fl_attachment:photo-booth-" + (i+1) + "/");
    return `<div class="foto"><img src="${esc(f)}" alt="Fotografía ${i+1}" loading="lazy"><br>` +
      `<a class="btn-neon" href="${esc(dl)}" download="photo-booth-${i+1}.jpg">Descargar</a></div>`;
  }).join("");
}
</script>
</body>
</html>
