<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f1ea">
<meta name="apple-mobile-web-app-title" content="Photo Booth">
<link rel="apple-touch-icon" href="./icono.png">
<link rel="icon" type="image/png" href="./icono.png">
<title>Photo Booth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./estilos.css?v=4">
<style>
  /* App-specific styles — the theme lives in estilos.css */
  html, body { overflow:hidden; }

  #pantalla { position:fixed; inset:0; z-index:2; display:flex;
              align-items:center; justify-content:center; }

  /* ===== Start: full-screen photo hero (blurred) ===== */
  #vista-inicio { cursor:pointer; position:absolute; inset:0; max-width:none;
                  padding:0; overflow:hidden; display:flex;
                  align-items:center; justify-content:center; background:#171310; }
  .inicio-fondo { position:absolute; inset:0;
                  background:url("./fondo-inicio.jpg") center/cover no-repeat;
                  filter:blur(6px) brightness(.94) saturate(1.12);
                  transform:scale(1.07); }
  .inicio-velo { position:absolute; inset:0;
                 background:linear-gradient(180deg, rgba(14,10,8,.48), rgba(14,10,8,.20) 42%, rgba(14,10,8,.68)); }
  .inicio-contenido { position:relative; z-index:2; padding:32px 24px; max-width:640px; }
  #vista-inicio .titular { color:#fff; text-shadow:0 8px 38px rgba(0,0,0,.5); }
  #vista-inicio .pastilla-rosa { background:rgba(255,255,255,.16);
                  border:1.5px solid rgba(255,255,255,.45); box-shadow:none;
                  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
  #vista-inicio .btn-negro { background:var(--degradado);
                  box-shadow:0 16px 38px rgba(244,63,142,.5);
                  animation:pulso 2.4s ease-in-out infinite; }
  @keyframes pulso { 0%,100% { transform:scale(1); } 50% { transform:scale(1.05); } }
  .inicio-titulo { font-size:clamp(42px,10vw,76px); margin:24px 0 16px; }
  .inicio-sub { color:rgba(255,255,255,.88); font-size:15px; font-weight:500;
                line-height:1.7; margin-bottom:34px;
                text-shadow:0 2px 14px rgba(0,0,0,.45); }
  .inicio-evento { font-size:13px; font-weight:800; letter-spacing:.24em;
                   text-transform:uppercase; color:#fff;
                   margin:-22px 0 30px; text-shadow:0 2px 14px rgba(0,0,0,.5); }

  /* ===== Camera: dark studio HUD ===== */
  #preview { position:fixed; inset:0; width:100%; height:100%; object-fit:cover;
             transform:scaleX(-1) scale(1.25); z-index:2; background:#000; }
  .hud-arriba { position:fixed; top:0; left:0; right:0; z-index:4;
                display:flex; justify-content:space-between; align-items:center;
                padding:22px 22px 46px;
                background:linear-gradient(to bottom, rgba(0,0,0,.55), transparent);
                pointer-events:none; }
  .envivo { display:inline-flex; align-items:center; gap:8px; color:#fff;
            font-size:12px; font-weight:800; letter-spacing:.2em; }
  .punto-rojo { width:9px; height:9px; border-radius:50%; background:#ff3b3b;
                box-shadow:0 0 10px #ff3b3b; }
  .contador { color:#fff; font-size:12px; font-weight:800; letter-spacing:.2em;
              background:rgba(255,255,255,.16); padding:8px 16px; border-radius:999px; }
  .hud-abajo { position:fixed; bottom:0; left:0; right:0; z-index:3; height:230px;
               background:linear-gradient(to top, rgba(0,0,0,.6), transparent);
               pointer-events:none; }
  #leyenda { position:fixed; bottom:196px; left:0; right:0; z-index:4; color:#fff;
             font-size:clamp(17px,4.5vw,25px); font-weight:800; letter-spacing:.1em;
             text-transform:uppercase; text-shadow:0 2px 18px rgba(0,0,0,.6); }
  #obturador { position:fixed; bottom:48px; left:50%; transform:translateX(-50%); z-index:4;
               width:88px; height:88px; border-radius:50%; cursor:pointer;
               border:4px solid #fff; background:rgba(255,255,255,.14);
               box-shadow:0 0 0 6px rgba(244,63,142,.35), 0 8px 30px rgba(0,0,0,.45); }
  #obturador::after { content:""; position:absolute; inset:16px; border-radius:50%;
                      background:var(--degradado); }
  #obturador:active { transform:translateX(-50%) scale(.92); }
  .puntos { position:fixed; bottom:158px; left:0; right:0; z-index:4; }
  .puntos span { display:inline-block; width:9px; height:9px; border-radius:50%;
                 background:rgba(255,255,255,.35); margin:0 8px; transition:all .3s; }
  .puntos span.ok { background:var(--degradado);
                    box-shadow:0 0 12px rgba(244,63,142,.8); }

  /* ===== Modes (Photos / Boomerang) ===== */
  #modos { position:fixed; bottom:238px; left:0; right:0; z-index:4;
           display:flex; gap:10px; justify-content:center; padding:10px 20px; }
  .modo { font-family:inherit; font-size:12px; font-weight:800;
          letter-spacing:.08em; text-transform:uppercase; color:#fff;
          background:rgba(255,255,255,.14); border:1.5px solid rgba(255,255,255,.25);
          padding:10px 20px; border-radius:999px; cursor:pointer; }
  .modo.sel { background:#fff; color:#161616; border-color:#fff; }

  /* ===== Language toggle (start screen) ===== */
  #idiomas { position:absolute; top:20px; right:20px; z-index:3; display:flex; gap:6px; }
  #idiomas button { font-family:inherit; font-size:12px; font-weight:800; letter-spacing:.1em;
                    color:#fff; background:rgba(255,255,255,.14);
                    border:1.5px solid rgba(255,255,255,.35);
                    padding:8px 14px; border-radius:999px; cursor:pointer; }
  #idiomas button.sel { background:#fff; color:#161616; border-color:#fff; }

  /* ===== Pending uploads badge (offline queue) ===== */
  #pendientes { position:fixed; left:18px; bottom:18px; z-index:7; cursor:pointer;
                background:rgba(22,22,22,.85); color:#fff; font-size:12px; font-weight:700;
                letter-spacing:.05em; padding:9px 16px; border-radius:999px; }

  /* ===== Countdown ===== */
  #cuenta { position:fixed; inset:0; z-index:5; display:none; align-items:center;
            justify-content:center; font-size:clamp(140px,38vw,220px);
            font-weight:900; color:#fff; text-shadow:0 12px 60px rgba(0,0,0,.55); }
  #flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none;
           z-index:6; transition:opacity .45s; }

  /* ===== QR ===== */
  .centro { position:relative; z-index:2; padding:32px 24px; width:100%;
            max-height:100%; overflow-y:auto; }
  .qr-titulo { font-size:clamp(34px,8.5vw,56px); margin:20px 0 26px; }
  #qrbox { display:inline-block; background:#fff; padding:16px; border-radius:20px;
           margin:0 auto 24px; box-shadow:var(--sombra); }
  #qrbox img, #qrbox canvas, #qrbox table { display:block; }
  .qr-sub { color:var(--tinta-suave); font-size:15px; font-weight:500;
            line-height:1.7; margin-bottom:30px; }
</style>
</head>
<body>

<script src="./fondo.js"></script>

<div id="pantalla">
  <div id="vista-inicio" role="button" aria-label="Tap to start">
    <div class="inicio-fondo" aria-hidden="true"></div>
    <div class="inicio-velo" aria-hidden="true"></div>
    <div id="idiomas">
      <button type="button" data-idioma="en">EN</button>
      <button type="button" data-idioma="es">ES</button>
    </div>
    <div class="inicio-contenido">
      <span class="pastilla pastilla-rosa">Pose &amp; Post</span>
      <h1 class="titular inicio-titulo" data-txt="titulo">Capture your moment<br><span class="degradado-texto">in 3 photos</span></h1>
      <p class="inicio-sub" data-txt="sub">5-second countdown · Strip ready to download</p>
      <p class="inicio-evento oculto" id="inicio-evento"></p>
      <span class="btn-negro" data-txt="empezar">Start →</span>
    </div>
  </div>

  <div id="vista-camara" class="oculto">
    <video id="preview" playsinline muted autoplay></video>
    <div class="hud-arriba">
      <span class="envivo"><span class="punto-rojo"></span><span data-txt="enVivo">Live</span></span>
      <span class="contador" id="contador">0/3</span>
    </div>
    <div class="hud-abajo"></div>
    <div id="leyenda">Smile</div>
    <div id="modos">
      <button class="modo sel" data-modo="fotos" data-txt="fotos">Photos</button>
      <button class="modo" data-modo="boomerang">Boomerang</button>
    </div>
    <button id="obturador" aria-label="Take photos"></button>
    <div class="puntos" id="puntos"><span></span><span></span><span></span></div>
  </div>

  <div id="cuenta">5</div>
  <div id="flash"></div>

  <div id="vista-qr" class="centro oculto">
    <span class="pastilla pastilla-verde" data-txt="qrPastilla">Photos ready!</span>
    <h2 class="titular qr-titulo" data-txt="qrTitulo">Scan to<br>download</h2>
    <div id="qrbox"><div id="qr"></div></div>
    <p class="qr-sub" data-txt="qrSub">Point your camera at the code<br>and take your photos</p>
    <button id="otra" class="btn-negro" data-txt="otra">New session</button>
  </div>

  <div id="pendientes" class="oculto"></div>
</div>

<script src="./qrcode.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const esperar = ms => new Promise(r => setTimeout(r, ms));
const video = $("preview");
const BASE = location.href.replace(/\/[^/]*$/, "");

// ===== Cloudinary setup (unsigned uploads, designed for the browser) =====
const CLOUD_NAME = "lubasdf9";
const UPLOAD_PRESET = "photo-booth";

// ===== Event setup (edit before each event) =====
// The client picks the template when booking; put their name here.
const EVENTO = {
  nombre: "",            // e.g. "Jennifer's Baby Shower" ("" = no customization)
  plantilla: "fiesta",   // fiesta | boda | baby-shower | cumpleanos | halloween | graduacion
  logo: "",              // optional client logo URL (Cloudinary) shown on the strip
};

// ===== Business setup (watermark on downloaded photos and strips) =====
const NEGOCIO = {
  nombre: "Pose & Post",  // e.g. "Flashbox Studio" ("" = no watermark)
};

// ===== Language: EN/ES toggle on the start screen, saved on this iPad =====
let idioma = "en";
try { if (localStorage.getItem("pb-idioma") === "es") idioma = "es"; } catch(e){}
const TXT = {
  en: {
    titulo: 'Capture your moment<br><span class="degradado-texto">in 3 photos</span>',
    sub: "5-second countdown · Strip ready to download",
    empezar: "Start →",
    enVivo: "Live",
    fotos: "Photos",
    qrPastilla: "Photos ready!",
    qrTitulo: "Scan to<br>download",
    qrSub: "Point your camera at the code<br>and take your photos",
    otra: "New session",
    sonrie: "Smile",
    muevete: "Get ready to move",
    fotoDe: i => `Photo ${i} of 3 — get ready`,
    boomListo: "Boomerang — get ready",
    mueve: "Move!",
    creandoBoom: "Creating your boomerang…",
    subiendo: "Uploading…",
    subiendoFotos: i => `Uploading photos… ${i}/3`,
    errorAlgo: "Something went wrong. Try again.",
    sinConexion: "Saved on this iPad — no connection. It will upload on its own.",
    errorCamara: "Couldn't access the camera. Check the permission in Settings.",
    pend: n => n === 1 ? "1 pending upload" : n + " pending uploads"
  },
  es: {
    titulo: 'Captura tu momento<br><span class="degradado-texto">en 3 fotos</span>',
    sub: "Cuenta regresiva de 5 segundos · Tira lista para descargar",
    empezar: "Empezar →",
    enVivo: "En vivo",
    fotos: "Fotos",
    qrPastilla: "¡Fotos listas!",
    qrTitulo: "Escanea para<br>descargar",
    qrSub: "Apunta tu cámara al código<br>y llévate tus fotos",
    otra: "Nueva sesión",
    sonrie: "Sonríe",
    muevete: "Prepárate para moverte",
    fotoDe: i => `Foto ${i} de 3 — prepárate`,
    boomListo: "Boomerang — prepárate",
    mueve: "¡Muévete!",
    creandoBoom: "Creando tu boomerang…",
    subiendo: "Subiendo…",
    subiendoFotos: i => `Subiendo fotos… ${i}/3`,
    errorAlgo: "Algo salió mal. Intenta de nuevo.",
    sinConexion: "Guardado en este iPad — sin conexión. Se subirá solo.",
    errorCamara: "No se pudo acceder a la cámara. Revisa el permiso en Ajustes.",
    pend: n => n === 1 ? "1 subida pendiente" : n + " subidas pendientes"
  }
};
const T = () => TXT[idioma];

function aplicarIdioma(){
  document.querySelectorAll("[data-txt]").forEach(el => {
    const v = T()[el.dataset.txt];
    if (typeof v === "string") el.innerHTML = v;
  });
  document.querySelectorAll("#idiomas button").forEach(b =>
    b.classList.toggle("sel", b.dataset.idioma === idioma));
  document.documentElement.lang = idioma;
  $("leyenda").textContent = (typeof modoActual !== "undefined" && modoActual === "boomerang") ? T().muevete : T().sonrie;
  actualizarPendientes();
}

// Gallery URL with the event config (name, template, business, language, logo)
function urlGaleria(extra){
  return BASE + "/galeria.html?" + extra +
    "&ev=" + encodeURIComponent(EVENTO.nombre) + "&tpl=" + encodeURIComponent(EVENTO.plantilla) +
    "&neg=" + encodeURIComponent(NEGOCIO.nombre) + "&lang=" + idioma +
    (EVENTO.logo ? "&logo=" + encodeURIComponent(EVENTO.logo) : "");
}

function mostrar(id){
  ["vista-inicio","vista-camara","vista-qr"].forEach(x => $(x).classList.toggle("oculto", x !== id));
}
function pintarPuntos(n){
  [...$("puntos").children].forEach((s,i) => s.classList.toggle("ok", i < n));
  $("contador").textContent = n + "/3";
}

// Show the event name on the start screen if set
if (EVENTO.nombre.trim()){
  const el = $("inicio-evento");
  el.textContent = EVENTO.nombre.trim();
  el.classList.remove("oculto");
}

$("vista-inicio").onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 1920 }, height: { ideal: 1440 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    mostrar("vista-camara");
  } catch (e) {
    alert(TXT[idioma].errorCamara);
  }
};

function capturarCanvas(anchoMax){
  const c = document.createElement("canvas");
  // 10% center crop per side: removes the edges, where the front
  // camera's wide angle distorts the most (fisheye effect)
  const r = 0.10;
  const sw = video.videoWidth * (1 - r*2);
  const sh = video.videoHeight * (1 - r*2);
  const sx = video.videoWidth * r;
  const sy = video.videoHeight * r;
  const s = Math.min(1, anchoMax / sw);
  c.width = Math.round(sw * s);
  c.height = Math.round(sh * s);
  const ctx = c.getContext("2d");
  ctx.translate(c.width, 0); ctx.scale(-1, 1); // mirror
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c;
}
function capturar(){
  const c = capturarCanvas(1600);
  flashFuerte();
  return c.toDataURL("image/jpeg", 0.9);
}
function flashFuerte(){
  const f = $("flash");
  f.style.transition = "none"; f.style.opacity = "0.9";
  requestAnimationFrame(() => { f.style.transition = "opacity .45s"; f.style.opacity = "0"; });
}
function flashSuave(){
  const f = $("flash");
  f.style.transition = "none"; f.style.opacity = "0.3";
  requestAnimationFrame(() => { f.style.transition = "opacity .3s"; f.style.opacity = "0"; });
}

async function cuentaRegresiva(segundos){
  const cuenta = $("cuenta");
  cuenta.style.display = "flex";
  for (let n = segundos; n >= 1; n--){ cuenta.textContent = n; await esperar(1000); }
  cuenta.style.display = "none";
}

async function subirFoto(blob, i){
  const fd = new FormData();
  fd.append("file", blob, "photo-booth-" + Date.now() + "-" + (i+1) + ".jpg");
  fd.append("upload_preset", UPLOAD_PRESET);
  fd.append("folder", "photo-booth");
  const r = await fetch("https://api.cloudinary.com/v1_1/" + CLOUD_NAME + "/image/upload",
                        { method:"POST", body:fd });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  if (!j.secure_url) throw new Error("sin url");
  return j.secure_url;
}

function mostrarQR(url){
  $("qr").innerHTML = "";
  new QRCode($("qr"), { text: url, width: 248, height: 248, correctLevel: QRCode.CorrectLevel.M });
  mostrar("vista-qr");
}

// ===== Offline queue (IndexedDB) =====
// If the venue's internet drops, sessions are saved on the iPad and
// uploaded automatically when the connection comes back.
let sesionActiva = false;
let procesandoCola = false;

function abrirDB(){
  return new Promise((res, rej) => {
    const rq = indexedDB.open("photo-booth", 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore("pendientes", { keyPath: "id" });
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
async function colaGuardar(item){
  try {
    const db = await abrirDB();
    return new Promise((res, rej) => {
      const tx = db.transaction("pendientes", "readwrite");
      tx.objectStore("pendientes").put(item);
      tx.oncomplete = res;
      tx.onerror = () => rej(tx.error);
    });
  } catch(e){ /* no IndexedDB: the session stays in memory only */ }
}
async function colaTodos(){
  try {
    const db = await abrirDB();
    return new Promise((res, rej) => {
      const rq = db.transaction("pendientes").objectStore("pendientes").getAll();
      rq.onsuccess = () => res(rq.result || []);
      rq.onerror = () => rej(rq.error);
    });
  } catch(e){ return []; }
}
async function colaBorrar(id){
  try {
    const db = await abrirDB();
    return new Promise((res, rej) => {
      const tx = db.transaction("pendientes", "readwrite");
      tx.objectStore("pendientes").delete(id);
      tx.oncomplete = res;
      tx.onerror = () => rej(tx.error);
    });
  } catch(e){}
}
async function actualizarPendientes(){
  const items = await colaTodos();
  const b = $("pendientes");
  if (items.length){
    b.textContent = T().pend(items.length);
    b.classList.remove("oculto");
  } else {
    b.classList.add("oculto");
  }
}
async function encolarSesion(item){
  item.id = Date.now() + Math.floor(Math.random() * 1000);
  await colaGuardar(item);
  await actualizarPendientes();
  $("leyenda").textContent = T().sinConexion;
}
async function procesarCola(){
  if (procesandoCola) return;
  procesandoCola = true;
  try {
    const items = (await colaTodos()).sort((a, b) => a.id - b.id);
    for (const item of items){
      try {
        let url;
        if (item.tipo === "boomerang"){
          const urlVideo = await subirVideo(item.video);
          url = urlGaleria("v=" + encodeURIComponent(urlVideo));
        } else {
          const urls = [];
          for (let i = 0; i < item.fotos.length; i++){
            const blob = await (await fetch(item.fotos[i])).blob();
            urls.push(await subirFoto(blob, i));
          }
          url = urlGaleria(urls.map(u => "f=" + encodeURIComponent(u)).join("&"));
        }
        await colaBorrar(item.id);
        // Show the QR only if the booth is free (nobody mid-session)
        if (!sesionActiva && $("vista-qr").classList.contains("oculto")) mostrarQR(url);
      } catch(e){ /* still offline: it stays queued for the next round */ }
    }
  } finally {
    procesandoCola = false;
    actualizarPendientes();
  }
}

async function subirYMostrarQR(fotos){
  try {
    const urls = [];
    for (let i = 0; i < fotos.length; i++){
      $("leyenda").textContent = T().subiendoFotos(i + 1);
      const blob = await (await fetch(fotos[i])).blob();
      urls.push(await subirFoto(blob, i));
    }
    mostrarQR(urlGaleria(urls.map(u => "f=" + encodeURIComponent(u)).join("&")));
  } catch(e){
    await encolarSesion({ tipo: "fotos", fotos });
  }
}

// Session modes: Photos (3 shots) or Boomerang (burst -> looping clip)
let modoActual = "fotos";
document.querySelectorAll(".modo").forEach(b => { b.onclick = () => {
  modoActual = b.dataset.modo;
  document.querySelectorAll(".modo").forEach(x => x.classList.toggle("sel", x === b));
  $("leyenda").textContent = modoActual === "boomerang" ? T().muevete : T().sonrie;
  // The 0/3 counter and progress dots only apply to Photos mode
  const esBoom = modoActual === "boomerang";
  $("contador").style.display = esBoom ? "none" : "";
  $("puntos").style.display = esBoom ? "none" : "";
}; });

async function sesionFotos(){
  const fotos = [];
  for (let i = 1; i <= 3; i++){
    $("leyenda").textContent = T().fotoDe(i);
    await cuentaRegresiva(5);
    fotos.push(capturar());
    pintarPuntos(i);
  }
  await subirYMostrarQR(fotos);
}

async function sesionBoomerang(){
  $("leyenda").textContent = T().boomListo;
  await cuentaRegresiva(3);
  $("leyenda").textContent = T().mueve;
  const frames = [];
  for (let i = 0; i < 14; i++){
    frames.push(capturarCanvas(960));
    flashSuave();
    await esperar(90);
  }
  $("leyenda").textContent = T().creandoBoom;
  const blob = await renderBoomerang(frames);
  await subirYMostrarQRBoomerang(blob);
}

// Renders the burst as a ping-pong loop video (forward + backward)
function renderBoomerang(frames){
  return new Promise((res, rej) => {
    const mime = ["video/mp4", "video/webm;codecs=vp9", "video/webm"]
      .find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m));
    if (!mime){ rej(new Error("MediaRecorder not supported")); return; }
    const w = frames[0].width, h = frames[0].height;
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const x = c.getContext("2d");
    const seq = frames.concat(frames.slice(1, -1).reverse());
    const rec = new MediaRecorder(c.captureStream(30), { mimeType: mime, videoBitsPerSecond: 5000000 });
    const chunks = [];
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = () => res(new Blob(chunks, { type: mime.split(";")[0] }));
    rec.onerror = rej;
    rec.start();
    seq.forEach((f, i) => setTimeout(() => {
      x.drawImage(f, 0, 0);
      if (NEGOCIO.nombre) marcaVideo(x, w, h);
    }, i * 90));
    setTimeout(() => rec.stop(), seq.length * 90 + 150);
  });
}

// Business watermark baked into the boomerang video
function marcaVideo(x, W, H){
  const tam = Math.max(20, Math.round(W * 0.036));
  const texto = "© " + NEGOCIO.nombre;
  x.save();
  x.font = "800 " + tam + "px Montserrat, Arial, sans-serif";
  x.textAlign = "right";
  x.textBaseline = "bottom";
  x.lineJoin = "round";
  x.lineWidth = Math.max(2, Math.round(tam * 0.22));
  x.strokeStyle = "rgba(0,0,0,.8)";
  const px = W - tam, py = H - Math.round(tam * 0.7);
  x.strokeText(texto, px, py);
  x.fillStyle = "#fff";
  x.fillText(texto, px, py);
  x.restore();
}

async function subirVideo(blob){
  const fd = new FormData();
  fd.append("file", blob, "boomerang-" + Date.now() + (blob.type.includes("mp4") ? ".mp4" : ".webm"));
  fd.append("upload_preset", UPLOAD_PRESET);
  fd.append("folder", "photo-booth");
  const r = await fetch("https://api.cloudinary.com/v1_1/" + CLOUD_NAME + "/video/upload",
                        { method:"POST", body:fd });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  if (!j.secure_url) throw new Error("sin url");
  return j.secure_url;
}

async function subirYMostrarQRBoomerang(blob){
  try {
    $("leyenda").textContent = T().subiendo;
    const urlVideo = await subirVideo(blob);
    mostrarQR(urlGaleria("v=" + encodeURIComponent(urlVideo)));
  } catch(e){
    await encolarSesion({ tipo: "boomerang", video: blob });
  }
}
