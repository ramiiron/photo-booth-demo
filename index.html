<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f1ea">
<meta name="apple-mobile-web-app-title" content="Photo Booth">
<link rel="apple-touch-icon" href="./icono.png">
<link rel="icon" type="image/png" href="./icono.png">
<title>Photo Booth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./estilos.css?v=4">
<style>
  /* App-specific styles — the theme lives in estilos.css */
  html, body { overflow:hidden; }

  #pantalla { position:fixed; inset:0; z-index:2; display:flex;
              align-items:center; justify-content:center; }

  /* ===== Start ===== */
  #vista-inicio { cursor:pointer; padding:32px 24px; max-width:640px; }
  .inicio-titulo { font-size:clamp(42px,10vw,76px); margin:24px 0 16px; }
  .inicio-sub { color:var(--tinta-suave); font-size:15px; font-weight:500;
                line-height:1.7; margin-bottom:34px; }
  .inicio-evento { font-size:13px; font-weight:800; letter-spacing:.24em;
                   text-transform:uppercase; color:var(--tinta-suave);
                   margin:-22px 0 30px; }

  /* ===== Camera: dark studio HUD ===== */
  #preview { position:fixed; inset:0; width:100%; height:100%; object-fit:cover;
             transform:scaleX(-1) scale(1.25); z-index:2; background:#000; }
  .hud-arriba { position:fixed; top:0; left:0; right:0; z-index:4;
                display:flex; justify-content:space-between; align-items:center;
                padding:22px 22px 46px;
                background:linear-gradient(to bottom, rgba(0,0,0,.55), transparent);
                pointer-events:none; }
  .envivo { display:inline-flex; align-items:center; gap:8px; color:#fff;
            font-size:12px; font-weight:800; letter-spacing:.2em; }
  .punto-rojo { width:9px; height:9px; border-radius:50%; background:#ff3b3b;
                box-shadow:0 0 10px #ff3b3b; }
  .contador { color:#fff; font-size:12px; font-weight:800; letter-spacing:.2em;
              background:rgba(255,255,255,.16); padding:8px 16px; border-radius:999px; }
  .hud-abajo { position:fixed; bottom:0; left:0; right:0; z-index:3; height:230px;
               background:linear-gradient(to top, rgba(0,0,0,.6), transparent);
               pointer-events:none; }
  #leyenda { position:fixed; bottom:196px; left:0; right:0; z-index:4; color:#fff;
             font-size:clamp(17px,4.5vw,25px); font-weight:800; letter-spacing:.1em;
             text-transform:uppercase; text-shadow:0 2px 18px rgba(0,0,0,.6); }
  #obturador { position:fixed; bottom:48px; left:50%; transform:translateX(-50%); z-index:4;
               width:88px; height:88px; border-radius:50%; cursor:pointer;
               border:4px solid #fff; background:rgba(255,255,255,.14);
               box-shadow:0 0 0 6px rgba(244,63,142,.35), 0 8px 30px rgba(0,0,0,.45); }
  #obturador::after { content:""; position:absolute; inset:16px; border-radius:50%;
                      background:var(--degradado); }
  #obturador:active { transform:translateX(-50%) scale(.92); }
  .puntos { position:fixed; bottom:158px; left:0; right:0; z-index:4; }
  .puntos span { display:inline-block; width:9px; height:9px; border-radius:50%;
                 background:rgba(255,255,255,.35); margin:0 8px; transition:all .3s; }
  .puntos span.ok { background:var(--degradado);
                    box-shadow:0 0 12px rgba(244,63,142,.8); }
  #reintentar { position:fixed; bottom:120px; left:50%; transform:translateX(-50%); z-index:4; }

  /* ===== Filters ===== */
  #filtros { position:fixed; bottom:238px; left:0; right:0; z-index:4;
             display:flex; gap:10px; justify-content:flex-start;
             overflow-x:auto; padding:10px 20px; scrollbar-width:none; }
  #filtros::-webkit-scrollbar { display:none; }
  .filtro { flex:0 0 auto; font-family:inherit; font-size:12px; font-weight:800;
            letter-spacing:.08em; text-transform:uppercase; color:#fff;
            background:rgba(255,255,255,.14); border:1.5px solid rgba(255,255,255,.25);
            padding:10px 18px; border-radius:999px; cursor:pointer; }
  .filtro.sel { background:#fff; color:#161616; border-color:#fff; }

  /* ===== Countdown ===== */
  #cuenta { position:fixed; inset:0; z-index:5; display:none; align-items:center;
            justify-content:center; font-size:clamp(140px,38vw,220px);
            font-weight:900; color:#fff; text-shadow:0 12px 60px rgba(0,0,0,.55); }
  #flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none;
           z-index:6; transition:opacity .45s; }

  /* ===== QR ===== */
  .centro { position:relative; z-index:2; padding:32px 24px; width:100%;
            max-height:100%; overflow-y:auto; }
  .qr-titulo { font-size:clamp(34px,8.5vw,56px); margin:20px 0 26px; }
  #qrbox { display:inline-block; background:#fff; padding:16px; border-radius:20px;
           margin:0 auto 24px; box-shadow:var(--sombra); }
  #qrbox img, #qrbox canvas, #qrbox table { display:block; }
  .qr-sub { color:var(--tinta-suave); font-size:15px; font-weight:500;
            line-height:1.7; margin-bottom:30px; }
</style>
</head>
<body>

<script src="./fondo.js"></script>

<div id="pantalla">
  <div id="vista-inicio" role="button" aria-label="Tap to start">
    <span class="pastilla pastilla-rosa">Self-Studio</span>
    <h1 class="titular inicio-titulo">Capture your moment<br><span class="degradado-texto">in 3 photos</span></h1>
    <p class="inicio-sub">5-second countdown · Strip ready to download</p>
    <p class="inicio-evento oculto" id="inicio-evento"></p>
    <span class="btn-negro">Start →</span>
  </div>

  <div id="vista-camara" class="oculto">
    <video id="preview" playsinline muted autoplay></video>
    <div class="hud-arriba">
      <span class="envivo"><span class="punto-rojo"></span>Live</span>
      <span class="contador" id="contador">0/3</span>
    </div>
    <div class="hud-abajo"></div>
    <div id="leyenda">Smile</div>
    <div id="filtros">
      <button class="filtro sel" data-filtro="original">Original</button>
      <button class="filtro" data-filtro="bn">B&amp;W</button>
      <button class="filtro" data-filtro="sepia">Sepia</button>
      <button class="filtro" data-filtro="vintage">Vintage</button>
      <button class="filtro" data-filtro="vivido">Vivid</button>
    </div>
    <button id="obturador" aria-label="Take photos"></button>
    <div class="puntos" id="puntos"><span></span><span></span><span></span></div>
    <button id="reintentar" class="btn-degradado oculto">Retry upload</button>
  </div>

  <div id="cuenta">5</div>
  <div id="flash"></div>

  <div id="vista-qr" class="centro oculto">
    <span class="pastilla pastilla-verde">Photos ready!</span>
    <h2 class="titular qr-titulo">Scan to<br>download</h2>
    <div id="qrbox"><div id="qr"></div></div>
    <p class="qr-sub">Point your camera at the code<br>and take your photos</p>
    <button id="otra" class="btn-negro">New session</button>
  </div>
</div>

<script src="./qrcode.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const esperar = ms => new Promise(r => setTimeout(r, ms));
const video = $("preview");
const BASE = location.href.replace(/\/[^/]*$/, "");

// ===== Cloudinary setup (unsigned uploads, designed for the browser) =====
const CLOUD_NAME = "lubasdf9";
const UPLOAD_PRESET = "photo-booth";

// ===== Event setup (edit before each event) =====
// The client picks the template when booking; put their name here.
const EVENTO = {
  nombre: "",            // e.g. "Jennifer's Baby Shower" ("" = no customization)
  plantilla: "fiesta",   // fiesta | boda | baby-shower | cumpleanos | halloween | graduacion
};

// ===== Business setup (watermark on downloaded photos and strips) =====
const NEGOCIO = {
  nombre: "",  // e.g. "Flashbox Studio" ("" = no watermark)
};

function mostrar(id){
  ["vista-inicio","vista-camara","vista-qr"].forEach(x => $(x).classList.toggle("oculto", x !== id));
}
function pintarPuntos(n){
  [...$("puntos").children].forEach((s,i) => s.classList.toggle("ok", i < n));
  $("contador").textContent = n + "/3";
}

// Show the event name on the start screen if set
if (EVENTO.nombre.trim()){
  const el = $("inicio-evento");
  el.textContent = EVENTO.nombre.trim();
  el.classList.remove("oculto");
}

// Filters: the guest picks one before shooting; applied to the live
// preview and baked into the photo (and therefore the strip)
const FILTROS = {
  original: "none",
  bn:       "grayscale(1) contrast(1.08)",
  sepia:    "sepia(0.85)",
  vintage:  "sepia(0.35) saturate(1.5) contrast(1.05)",
  vivido:   "saturate(1.7) contrast(1.12)",
};
let filtroActual = "original";
function fijarFiltro(nombre){
  filtroActual = FILTROS[nombre] ? nombre : "original";
  document.querySelectorAll(".filtro").forEach(x => x.classList.toggle("sel", x.dataset.filtro === filtroActual));
  video.style.filter = FILTROS[filtroActual];
}
document.querySelectorAll(".filtro").forEach(b => { b.onclick = () => fijarFiltro(b.dataset.filtro); });

$("vista-inicio").onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 1920 }, height: { ideal: 1440 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    mostrar("vista-camara");
  } catch (e) {
    alert("Couldn't access the camera. Check the permission in Settings.");
  }
};

function capturar(){
  const c = document.createElement("canvas");
  // 10% center crop per side: removes the edges, where the front
  // camera's wide angle distorts the most (fisheye effect)
  const r = 0.10;
  const sw = video.videoWidth * (1 - r*2);
  const sh = video.videoHeight * (1 - r*2);
  const sx = video.videoWidth * r;
  const sy = video.videoHeight * r;
  const s = Math.min(1, 1600 / sw);
  c.width = Math.round(sw * s);
  c.height = Math.round(sh * s);
  const ctx = c.getContext("2d");
  ctx.translate(c.width, 0); ctx.scale(-1, 1); // mirror
  ctx.filter = FILTROS[filtroActual];
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, c.width, c.height);
  const f = $("flash");
  f.style.transition = "none"; f.style.opacity = "0.9";
  requestAnimationFrame(() => { f.style.transition = "opacity .45s"; f.style.opacity = "0"; });
  return c.toDataURL("image/jpeg", 0.9);
}

async function cuentaRegresiva(segundos){
  const cuenta = $("cuenta");
  cuenta.style.display = "flex";
  for (let n = segundos; n >= 1; n--){ cuenta.textContent = n; await esperar(1000); }
  cuenta.style.display = "none";
}

async function subirFoto(blob, i){
  const fd = new FormData();
  fd.append("file", blob, "photo-booth-" + Date.now() + "-" + (i+1) + ".jpg");
  fd.append("upload_preset", UPLOAD_PRESET);
  fd.append("folder", "photo-booth");
  const r = await fetch("https://api.cloudinary.com/v1_1/" + CLOUD_NAME + "/image/upload",
                        { method:"POST", body:fd });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  if (!j.secure_url) throw new Error("sin url");
  return j.secure_url;
}

async function subirYMostrarQR(fotos){
  $("reintentar").classList.add("oculto");
  try {
    const urls = [];
    for (let i = 0; i < fotos.length; i++){
      $("leyenda").textContent = "Uploading photos… " + (i+1) + "/3";
      const blob = await (await fetch(fotos[i])).blob();
      urls.push(await subirFoto(blob, i));
    }
    const url = BASE + "/galeria.html?" + urls.map(u => "f=" + encodeURIComponent(u)).join("&") +
      "&ev=" + encodeURIComponent(EVENTO.nombre) + "&tpl=" + encodeURIComponent(EVENTO.plantilla) +
      "&neg=" + encodeURIComponent(NEGOCIO.nombre);
    $("qr").innerHTML = "";
    new QRCode($("qr"), { text: url, width: 248, height: 248, correctLevel: QRCode.CorrectLevel.M });
    mostrar("vista-qr");
  } catch(e){
    $("leyenda").textContent = "Upload failed. Check your internet.";
    $("reintentar").classList.remove("oculto");
    $("reintentar").onclick = () => subirYMostrarQR(fotos);
  }
}

$("obturador").onclick = async () => {
  $("obturador").style.display = "none";

  const fotos = [];
  for (let i = 1; i <= 3; i++){
    $("leyenda").textContent = `Photo ${i} of 3 — get ready`;
    await cuentaRegresiva(5);
    fotos.push(capturar());
    pintarPuntos(i);
  }

  await subirYMostrarQR(fotos);

  pintarPuntos(0);
  fijarFiltro("original");
  $("leyenda").textContent = "Smile";
  $("obturador").style.display = "";
  $("reintentar").classList.add("oculto");
};

$("otra").onclick = () => mostrar("vista-inicio");
</script>
</body>
</html>
